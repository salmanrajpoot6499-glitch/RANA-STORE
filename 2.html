<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RANA STORE</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800}
.cart{border:0;border-radius:20px;padding:10px 15px;cursor:pointer}
.hero{background:linear-gradient(135deg,#111,#555);color:#fff;text-align:center;padding:55px 6%}
.hero h1{font-size:42px;margin:0 0 10px}
.cats{text-align:center;padding:22px}
.cats button{background:#111;color:#fff;border:0;border-radius:20px;padding:11px 18px;margin:4px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:10px 6% 40px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 14px #0001}
.pic{height:230px;background:#fff;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box}
.pic img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;border-radius:10px}
.info{padding:15px}
.price{font-weight:bold;font-size:19px;margin:10px 0}
.add{width:100%;padding:11px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}
footer{background:#111;color:#fff;text-align:center;padding:25px}
.modal{display:none;position:fixed;inset:0;background:#0008}
.box{background:#fff;width:min(500px,90%);margin:8vh auto;padding:22px;border-radius:15px}
.close{float:right;border:0;background:none;font-size:25px}
.item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ddd}
.wa{display:block;background:#25d366;color:#fff;text-decoration:none;text-align:center;padding:12px;border-radius:8px;margin-top:15px}
</style>
</head>
<body>
<header>

  <button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>RANA STORE</h1>
  <p>Shirts • Trousers • Sports • Mobiles & Accessories</p>
  <b>Quality products at great prices</b>
</section>

<div class="cats">
  <button onclick="filter('all')">All</button>
  <button onclick="filter('clothes')">👕 Clothes</button>
  <button onclick="filter('sports')">🏏 Sports</button>
</div>

<main class="grid" id="products"></main>

<footer>
  <h3>RANA STORE</h3>
  <p>Online Shopping Store</p>
</footer>

</div>

let cart = [];
const productsEl = document.getElementById('products');

function render(list=products){
  productsEl.innerHTML = list.map(p => {
    const i = products.indexOf(p);
    return `<article class="card">
      <div class="pic"><img src="${p[3]}" alt="${p[0]}"></div>
      <div class="info">
        <h3>${p[0]}</h3>
        <small>${p[1]}</small>
        <div class="price">Rs. ${p[2].toLocaleString()}</div>
        <button class="add" onclick="add(${i})">Add to Cart</button>
      </div>
    </article>`;
  }).join('');
}

function filter(c){
  render(c==='all' ? products : products.filter(p=>p[1]===c));
}

function add(i){
  cart.push(products[i]);
  document.getElementById('count').textContent = cart.length;
}

function openCart(){
  document.getElementById('modal').style.display='block';
  let t=cart.reduce((s,p)=>s+p[2],0);
  document.getElementById('items').innerHTML=cart.length
    ? cart.map(p=>`<div class="item"><span>${p[0]}</span><b>Rs. ${p[2].toLocaleString()}</b></div>`).join('')
    : 'Your cart is empty.';
  document.getElementById('total').textContent=t.toLocaleString();
  document.getElementById('wa').href='https://wa.me/?text='+encodeURIComponent(
    'Assalam o Alaikum, I want to order from RANA STORE:\n'+
    cart.map(p=>'- '+p[0]+' Rs. '+p[2]).join('\n')+
    '\nTotal: Rs. '+t
  );
}

function closeCart(){
  document.getElementById('modal').style.display='none';
}

render();
</script>
